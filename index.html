<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OvozAI</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0e15;color:#f2f3f7;font:15px system-ui}header{padding:20px max(20px,calc((100% - 1000px)/2));border-bottom:1px solid #252938;font-weight:800}header b{color:#a58aff}.main{max-width:1000px;margin:auto;padding:35px 20px}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px}.hero p{color:#a2a6b6}.box{background:#151923;border:1px solid #2b3040;border-radius:16px;padding:20px;margin-top:20px}.box h2{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}.input,textarea{background:#0d1018;border:1px solid #343a4b;color:white;border-radius:10px;padding:12px;flex:1;min-width:180px}.btn{border:0;background:#8c70ff;color:white;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.list{display:grid;gap:10px;margin-top:15px}.item{background:#10141d;border:1px solid #282e3c;border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#9197a8}.foot{font-size:12px;color:#737b8e;margin-top:20px}small{color:#8e95a5}button:disabled{opacity:.5}</style></head><body><header>B•BEKIUZ <b>OVOZAI</b></header><main class="main"><section class="hero"><h1>Ovoz bilan ishlash uchun Uzbek audio toolkit</h1><p>OvozAI — matn, transkripsiya va audio ish jarayonlari uchun sodda Uzbek audio toolkit MVP.</p></section><div class="box"><h2>Matn yordamchisi</h2><div class="row"><input id="inp" class="input" placeholder="Ovoz vositalari"><button class="btn" onclick="add()">Audio vositalari: matnni tayyorlash, transkripsiya uchun matnni ko'rish, audio ishlar ro'yxati.</button></div><p id="hint" class="muted">Matn yoki audio haqida ma'lumot</p><div id="list" class="list"></div></div><div class="foot">MVP demo · Ma'lumotlar qurilmangiz brauzerida saqlanadi (ayrim ilovalarda sessiya doirasida).</div></main><script>const key="OvozAI_demo";let arr=JSON.parse(localStorage.getItem(key)||"[]");function render(){document.getElementById("list").innerHTML=arr.map((x,i)=>'<div class="item"><span>'+esc(x)+'</span><button class="btn" onclick="del('+i+')">✕</button></div>').join("")}function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function add(){let v=document.getElementById("inp").value.trim();if(!v)return;arr.unshift(v);localStorage.setItem(key,JSON.stringify(arr));document.getElementById("inp").value="";render()}function del(i){arr.splice(i,1);localStorage.setItem(key,JSON.stringify(arr));render()}render();</script></body></html>
