<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>OvozAI</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>OVOZAI</b></header><main class="main"><section class="hero"><h1>OvozAI</h1><p>O‘zbekcha matn va ovoz bilan ishlash vositalari.</p></section><section class="panel"><h2>Matn maydoni</h2><textarea id="txt" rows="7" placeholder="Matnni shu yerga yozing yoki nutqni tanib olish orqali kiriting..."></textarea><div class="form" style="margin-top:12px"><select id="voice" aria-label="Ovoz tanlash"><option value="">Brauzer ovozi yuklanmoqda...</option></select><select id="rate" aria-label="O‘qish tezligi"><option value="0.8">Sekin</option><option value="1" selected>Oddiy tezlik</option><option value="1.2">Tez</option><option value="1.4">Juda tez</option></select></div><div class="actions"><button onclick="startRec()">🎙 Ovozdan matnga</button><button class="alt" onclick="stopRec()">Tinglashni to‘xtatish</button><button class="alt" onclick="speak()">🔊 O‘qib berish</button><button class="alt" onclick="stopSpeak()">To‘xtatish</button><button class="alt" onclick="copy()">Nusxa olish</button><button class="alt" onclick="downloadText()">TXT yuklash</button></div><p id="status" class="muted">Brauzeringiz qo‘llaydigan ovoz funksiyalari ishlatiladi.</p></section><section class="panel"><h2>Matn statistikasi</h2><div class="stats" id="stats"></div></section></main><footer class="foot">BEKIUZ · OvozAI · Ma’lumotlar ushbu brauzerda saqlanadi. Demo versiya.</footer><script>
const $=id=>document.getElementById(id),area=$('txt');let recognition=null,availableVoices=[];
area.addEventListener('input',count);
function count(){let value=area.value.trim(),words=value?value.split(/\s+/).length:0,sentences=value?value.split(/[.!?。！？]+/).filter(x=>x.trim()).length:0;$('stats').innerHTML='<div class="stat"><b>'+words+'</b><small>So‘z</small></div><div class="stat"><b>'+area.value.length+'</b><small>Belgi</small></div><div class="stat"><b>'+sentences+'</b><small>Gap</small></div>'}
function loadVoices(){if(!('speechSynthesis'in window))return;availableVoices=speechSynthesis.getVoices();let select=$('voice'),previous=select.value;select.innerHTML='';if(!availableVoices.length){select.innerHTML='<option value="">Brauzer standart ovozi</option>';return}availableVoices.forEach((v,i)=>{let option=document.createElement('option');option.value=String(i);option.textContent=v.name+' ('+v.lang+')';select.appendChild(option)});let preferred=availableVoices.findIndex(v=>/^uz([_-]|$)/i.test(v.lang));select.value=previous&&availableVoices[Number(previous)]?previous:String(preferred>=0?preferred:0)}
function speak(){if(!area.value.trim()){$('status').textContent='Avval matn kiriting.';return}if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){$('status').textContent='Bu brauzer ovoz chiqarishni qo‘llamaydi.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(area.value),idx=Number($('voice').value),voice=availableVoices[idx];if(voice){u.voice=voice;u.lang=voice.lang}else{u.lang='uz-UZ'}u.rate=Number($('rate').value)||1;u.onstart=()=>{$('status').textContent='Ovoz chiqarilmoqda...'};u.onend=()=>{$('status').textContent='O‘qib berish tugadi.'};u.onerror=e=>{$('status').textContent='Ovoz xatosi: '+e.error};if(!voice||!/^uz([_-]|$)/i.test(voice.lang))$('status').textContent='Brauzerda o‘zbekcha ovoz topilmadi; tanlangan ovoz talaffuzi farq qilishi mumkin.';speechSynthesis.speak(u)}
function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel();$('status').textContent='O‘qish to‘xtatildi.'}
function startRec(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='Nutqni tanish bu brauzerda mavjud emas. Chrome’da mikrofon ruxsatini tekshiring.';return}if(recognition)recognition.stop();recognition=new R();recognition.lang='uz-UZ';recognition.interimResults=true;recognition.continuous=true;recognition.onresult=e=>{let text='';for(let i=0;i<e.results.length;i++)text+=e.results[i][0].transcript+(e.results[i].isFinal?' ':'');area.value=text.trim();count()};recognition.onerror=e=>{$('status').textContent='Mikrofon xatosi: '+e.error};recognition.onend=()=>{$('status').textContent='Nutqni tinglash yakunlandi.';recognition=null};try{recognition.start();$('status').textContent='Tinglayapman... Gapiring.'}catch(e){$('status').textContent='Mikrofonni ishga tushirib bo‘lmadi. Ruxsatni tekshiring.'}}
function stopRec(){if(recognition){recognition.stop();recognition=null;$('status').textContent='Tinglash to‘xtatildi.'}else $('status').textContent='Hozir mikrofon faol emas.'}
async function copy(){if(!area.value.trim()){$('status').textContent='Matn yo‘q.';return}try{await navigator.clipboard.writeText(area.value);$('status').textContent='Nusxa olindi.'}catch(e){$('status').textContent='Nusxa olish uchun HTTPS va clipboard ruxsati kerak.'}}
function downloadText(){if(!area.value.trim()){$('status').textContent='Yuklash uchun matn kiriting.';return}let a=document.createElement('a'),u=URL.createObjectURL(new Blob([area.value],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='ovozai-matn.txt';a.click();URL.revokeObjectURL(u)}
if('speechSynthesis'in window){loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}else $('voice').innerHTML='<option>Ovoz chiqarish qo‘llanmaydi</option>';
count();
</script></body></html>
