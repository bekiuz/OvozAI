<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>OvozAI</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>OVOZAI</b></header><main class="main"><section class="hero"><h1>OvozAI</h1><p>O‘zbekcha matn va ovoz bilan ishlash vositalari.</p></section><section class="panel"><h2>Matn maydoni</h2><textarea id="txt" rows="7" placeholder="Matnni shu yerga yozing yoki nutqni tanib olish orqali kiriting..."></textarea><div class="actions"><button onclick="startRec()">🎙 Ovozdan matnga</button><button class="alt" onclick="speak()">🔊 O‘qib berish</button><button class="alt" onclick="stopSpeak()">To‘xtatish</button><button class="alt" onclick="copy()">Nusxa olish</button><button class="alt" onclick="downloadText()">TXT yuklash</button></div><p id="status" class="muted">Brauzeringiz qo‘llaydigan ovoz funksiyalari ishlatiladi.</p></section><section class="panel"><h2>Matn statistikasi</h2><div class="stats" id="stats"></div></section></main><footer class="foot">BEKIUZ · OvozAI · Ma’lumotlar ushbu brauzerda saqlanadi. Demo versiya.</footer><script>const area=document.getElementById('txt');area.addEventListener('input',count);function count(){let s=area.value.trim();stats.innerHTML='<div class="stat"><b>'+ (s?s.split(/\\s+/).length:0)+'</b><small>So‘z</small></div><div class="stat"><b>'+area.value.length+'</b><small>Belgi</small></div><div class="stat"><b>'+ (s?s.split(/[.!?]+/).filter(Boolean).length:0)+'</b><small>Gap</small></div>'}function speak(){if(!area.value.trim())return status.textContent='Avval matn kiriting.';if(!('speechSynthesis'in window))return status.textContent='Bu brauzer ovoz chiqarishni qo‘llamaydi.';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(area.value);u.lang='uz-UZ';speechSynthesis.speak(u);status.textContent='Ovoz chiqarilmoqda...'}function stopSpeak(){speechSynthesis.cancel();status.textContent='To‘xtatildi.'}function startRec(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return status.textContent='Speech Recognition bu brauzerda mavjud emas. Chrome orqali sinab ko‘ring.';let r=new R();r.lang='uz-UZ';r.interimResults=true;r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;area.value=s;count()};r.onerror=e=>status.textContent='Mikrofon xatosi: '+e.error;r.onend=()=>status.textContent='Tinglash tugadi.';r.start();status.textContent='Tinglayapman...'}async function copy(){try{await navigator.clipboard.writeText(area.value);status.textContent='Nusxa olindi.'}catch(e){status.textContent='Nusxa olish uchun HTTPS kerak bo‘lishi mumkin.'}}function downloadText(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([area.value],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='ovozai-matn.txt';a.click();URL.revokeObjectURL(u)}count();</script></body></html>
